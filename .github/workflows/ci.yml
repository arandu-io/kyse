name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.25"), and setup-go installs exactly that -- 1.25.0, whose
          # standard library carries vulnerabilities fixed later. govulncheck
          # below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against.
          go-version: stable

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # `gofmt -l .` skips nothing, and what this module publishes is not all
        # valid Go on purpose:
        #
        #   testdata/    the golden files, which are the published output --
        #                including .kyse.go views, which gofmt refuses
        #   *.kyse.go    kyse sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The golden files ARE the product: they are the bytes that land in
      # somebody's project. A change to them has to show up as a diff in review
      # rather than as a surprise in a checkout, so a run that rewrites them and
      # leaves the tree dirty is a failure.
      # One dependency, and it is the framework.
      #
      # A component compiles to a function that calls view.Text and returns
      # template.HTML, so the framework is not optional here -- it is what the
      # output is made of. Anything else is: this module is imported by every
      # project that draws a button, and a second require is a download for all
      # of them.
      - name: one dependency
        run: |
          # Direct requires only. What the framework pulls in is the
          # framework's to answer for, and listing it here would make this step
          # fail every time it takes a dependency of its own.
          extra=$(grep -E '^\s+[a-z].*/' go.mod | grep -v '// indirect' | grep -v 'arandu-io/framework' || true)
          if [ -n "$extra" ]; then
            echo "this module took a dependency beyond the framework:"
            echo "$extra"
            exit 1
          fi

      # The generated views are committed, and a stale one ships.
      #
      # go get has no build step to run, so what is in the repository is what
      # every project imports. This rebuilds them and fails if the tree moved.
      - name: the compiled components are the ones in the tree
        run: |
          go install github.com/arandu-io/aru@latest
          "$(go env GOPATH)/bin/aru" view:build
          if [ -n "$(git status --porcelain components)" ]; then
            echo "the committed components do not match their sources:"
            git --no-pager diff --stat components
            exit 1
          fi

      # The same argument for the icons, which are vendored rather than
      # compiled: the pin is a commit of phosphor-icons/core written into
      # internal/icongen, so regenerating has to produce byte-for-byte what is
      # committed. A run that moves the tree means somebody hand-edited an icon
      # -- which compiles, and which the next regeneration would silently undo.
      - name: the vendored icons are the ones upstream published
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain icons)" ]; then
            echo "the committed icons do not match the pinned Phosphor commit:"
            git --no-pager diff --stat icons
            exit 1
          fi

      - name: no Node
        run: |
          found=$(find . -name package.json -o -name node_modules -o -name 'vite.config.*' | grep -v '^./.git' || true)
          if [ -n "$found" ]; then
            echo "Node entered the view layer:"
            echo "$found"
            exit 1
          fi

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
